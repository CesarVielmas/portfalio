@if(contentSignal()){
    <div [ngStyle]="stylesFatherDiv" class="fatherDiv" #fatherDiv>
    @for (data of contentSignal(); track data['id'];) {
        @if(data['functionToDo']){
        <div [ngStyle]="stylesCard" class="carrusel-card" style="position: relative;left:0%;will-change: left;transition: left 0.2s ease;" [typeAnimation]="'hover-scale'" [animationStyle]="{'scaleDuration':'0.2s','scaleTiming':'ease-in-out','scaleCuantity':'1.02'}" (click)="eventFunctionToDo(data['id'])" #cardElement>

            @if(('urlImage') in data){
                <img alt="image_carrusel" class="image-carrusel" [src]="data['urlImage']" />
            }
            @if(('contentText') in data){
                <p class="carrusel-text" [style.color]="textColor" [style.backgroundColor]="backgroundColorText">{{ data['contentText'] }}</p>
            }
        </div>
        }
        @else{
        <div [ngStyle]="stylesCard" class="carrusel-card" style="position: relative;left:0%;will-change: left;transition: left 0.2s ease;" #cardElement>

            @if(('urlImage') in data){
                <img alt="image_carrusel" class="image-carrusel" [src]="data['urlImage']" />
            }
            @if(('contentText') in data){
                <p class="carrusel-text" [style.color]="textColor" [style.backgroundColor]="backgroundColorText">{{ data['contentText'] }}</p>
            }
        </div>
        }
    }
    </div>
}
